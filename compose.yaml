services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: dev
      APP_SECRET: "${APP_SECRET:-mon-allure-dev-secret}"
      DATABASE_URL: "mysql://${MYSQL_USER:-mon_allure_user}:${MYSQL_PASSWORD:-mon_allure_password}@database:3306/${MYSQL_DATABASE:-mon_allure}?serverVersion=8.0&charset=utf8mb4"
      DEFAULT_URI: "http://localhost:${APP_PORT:-8080}"
    volumes:
      - ./backend:/var/www/html
      - ./docs:/var/www/docs:ro
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-mon_allure}"
      MYSQL_USER: "${MYSQL_USER:-mon_allure_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-mon_allure_password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_password}"
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  backend_vendor:
  backend_var:
  database_data:
