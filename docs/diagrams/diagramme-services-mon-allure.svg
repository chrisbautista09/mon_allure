<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17399a"/><stop offset=".37" stop-color="#102769"/>
      <stop offset=".72" stop-color="#07142e"/><stop offset="1" stop-color="#030812"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="8%" r="58%">
      <stop offset="0" stop-color="#275bff" stop-opacity=".62"/><stop offset="1" stop-color="#275bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17399a"/><stop offset="1" stop-color="#0d1d42"/>
    </linearGradient>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 5 0 10Z" fill="#00d9ff"/>
    </marker>
    <marker id="arrowSoft" markerWidth="13" markerHeight="13" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 5 0 10Z" fill="#8da9cf"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#f1f6ff}.title{font-size:76px;font-weight:800}.subtitle{font-size:32px;fill:#b9c8e2}.brand{font-size:28px;font-weight:800;letter-spacing:7px;fill:#00d9ff}
      .section{fill:#07142e;fill-opacity:.82;stroke:#5275aa;stroke-width:2.5}.sectionTitle{font-size:28px;font-weight:800;fill:#00d9ff;letter-spacing:2px}.sectionHint{font-size:21px;fill:#9fb4d2}
      .card{fill:#0d1d42;stroke:#00d9ff;stroke-width:2.5}.core{fill:url(#core);stroke:#00d9ff;stroke-width:4}.cardTitle{font-size:27px;font-weight:750;text-anchor:middle}.cardSub{font-size:20px;fill:#b9c8e2;text-anchor:middle}.smallTitle{font-size:23px;font-weight:700;text-anchor:middle}.smallSub{font-size:18px;fill:#aebfda;text-anchor:middle}
      .arrow{fill:none;stroke:#00d9ff;stroke-width:4;marker-end:url(#arrow)}.soft{fill:none;stroke:#8da9cf;stroke-width:3;stroke-dasharray:11 8;marker-end:url(#arrowSoft)}.linkLabel{font-size:20px;font-weight:700;fill:#cbd8eb;text-anchor:middle}
      .db{fill:#08152f;stroke:#13ca8a;stroke-width:3}.dbText{font-size:25px;font-weight:700;text-anchor:middle}.pill{fill:#13ca8a}.pillText{font-size:18px;font-weight:800;fill:#03251b;text-anchor:middle}
    </style>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/><rect width="3840" height="2160" fill="url(#glow)"/>
  <circle cx="174" cy="134" r="62" fill="#050b18" stroke="#00d9ff" stroke-width="4" filter="url(#cyanGlow)"/>
  <text x="174" y="155" text-anchor="middle" font-size="62" font-weight="900" font-style="italic" fill="#00d9ff" transform="rotate(-6 174 134)">M</text>
  <path d="M137 176Q174 155 211 176" fill="none" stroke="#275bff" stroke-width="9" stroke-linecap="round"/>
  <text x="270" y="121" class="brand">MON ALLURE TRAINING</text>
  <text x="270" y="205" class="title">Diagramme des services Mon Allure</text>
  <text x="270" y="258" class="subtitle">V.4 — Architecture des services Symfony et responsabilités métier</text>
  <line x1="110" y1="315" x2="3730" y2="315" stroke="#00d9ff" stroke-opacity=".5" stroke-width="2"/>

  <!-- Entrée application -->
  <g filter="url(#shadow)">
    <rect class="card" x="210" y="375" width="680" height="130" rx="28"/>
    <text class="cardTitle" x="550" y="430">Interface Twig + formulaires</text><text class="cardSub" x="550" y="468">Saisie du profil, objectif et performances</text>
    <rect class="card" x="1370" y="375" width="800" height="130" rx="28"/>
    <text class="cardTitle" x="1770" y="430">Contrôleurs Symfony</text><text class="cardSub" x="1770" y="468">Validation HTTP et appel des services métier</text>
  </g>
  <path class="arrow" d="M890 440H1370"/><text class="linkLabel" x="1130" y="420">requêtes</text>

  <!-- Orchestration -->
  <rect class="section" x="180" y="570" width="3480" height="340" rx="34"/>
  <text class="sectionTitle" x="240" y="625">ORCHESTRATION MÉTIER</text><text class="sectionHint" x="240" y="660">Coordonne les services spécialisés sans contenir tous les calculs</text>
  <g filter="url(#shadow)">
    <rect class="core" x="420" y="700" width="850" height="145" rx="30"/>
    <text class="cardTitle" x="845" y="758">TrainingPlanGeneratorService</text><text class="cardSub" x="845" y="800">Création complète du plan personnalisé</text>
    <rect class="core" x="1495" y="700" width="850" height="145" rx="30"/>
    <text class="cardTitle" x="1920" y="758">AdaptationService</text><text class="cardSub" x="1920" y="800">Ajustement selon les performances réelles</text>
    <rect class="core" x="2570" y="700" width="850" height="145" rx="30"/>
    <text class="cardTitle" x="2995" y="758">TrainingPlanPdfExporter</text><text class="cardSub" x="2995" y="800">Export du plan pour consultation hors ligne</text>
  </g>
  <path class="arrow" d="M1770 505V640H845V700"/><path class="arrow" d="M1770 505V700"/><path class="arrow" d="M1770 505V640H2995V700"/>

  <!-- Domain groups -->
  <rect class="section" x="180" y="980" width="820" height="720" rx="32"/>
  <text class="sectionTitle" x="225" y="1035">PLANIFICATION</text><text class="sectionHint" x="225" y="1070">Profil, dates et faisabilité</text>
  <g>
    <rect class="card" x="245" y="1115" width="690" height="105" rx="22"/><text class="smallTitle" x="590" y="1160">ProfileTrainingDataValidator</text><text class="smallSub" x="590" y="1192">Contrôle les données sportives</text>
    <rect class="card" x="245" y="1250" width="690" height="105" rx="22"/><text class="smallTitle" x="590" y="1295">PlanStartDateCalculator</text><text class="smallSub" x="590" y="1327">Détermine le début du plan</text>
    <rect class="card" x="245" y="1385" width="690" height="105" rx="22"/><text class="smallTitle" x="590" y="1430">PlanDurationCalculator</text><text class="smallSub" x="590" y="1462">Calcule la durée recommandée</text>
    <rect class="card" x="245" y="1520" width="690" height="105" rx="22"/><text class="smallTitle" x="590" y="1565">FeasibilityService</text><text class="smallSub" x="590" y="1597">Évalue si l’objectif est réaliste</text>
  </g>

  <rect class="section" x="1065" y="980" width="820" height="720" rx="32"/>
  <text class="sectionTitle" x="1110" y="1035">CALCULS SPORTIFS</text><text class="sectionHint" x="1110" y="1070">Allure, intensité et charge</text>
  <g>
    <rect class="card" x="1130" y="1115" width="330" height="105" rx="22"/><text class="smallTitle" x="1295" y="1160">PaceCalculator</text><text class="smallSub" x="1295" y="1192">Allures cibles</text>
    <rect class="card" x="1490" y="1115" width="330" height="105" rx="22"/><text class="smallTitle" x="1655" y="1160">IntensityZone</text><text class="smallSub" x="1655" y="1192">Zones d’effort</text>
    <rect class="card" x="1130" y="1250" width="690" height="105" rx="22"/><text class="smallTitle" x="1475" y="1295">WeeklyLoadService</text><text class="smallSub" x="1475" y="1327">Répartit la charge par semaine</text>
    <rect class="card" x="1130" y="1385" width="690" height="105" rx="22"/><text class="smallTitle" x="1475" y="1430">TrainingLoadCalculator</text><text class="smallSub" x="1475" y="1462">Mesure la charge des séances</text>
    <rect class="card" x="1130" y="1520" width="690" height="105" rx="22"/><text class="smallTitle" x="1475" y="1565">ElevationCalculatorService</text><text class="smallSub" x="1475" y="1597">Adapte le dénivelé au terrain</text>
  </g>

  <rect class="section" x="1950" y="980" width="820" height="720" rx="32"/>
  <text class="sectionTitle" x="1995" y="1035">SÉANCES</text><text class="sectionHint" x="1995" y="1070">Génération et calendrier</text>
  <g>
    <rect class="card" x="2015" y="1115" width="690" height="105" rx="22"/><text class="smallTitle" x="2360" y="1160">SessionGeneratorService</text><text class="smallSub" x="2360" y="1192">Crée les séances personnalisées</text>
    <rect class="card" x="2015" y="1250" width="690" height="105" rx="22"/><text class="smallTitle" x="2360" y="1295">SessionScheduleValidator</text><text class="smallSub" x="2360" y="1327">Contrôle la cohérence du calendrier</text>
    <rect class="card" x="2015" y="1385" width="690" height="105" rx="22"/><text class="smallTitle" x="2360" y="1430">TaperService</text><text class="smallSub" x="2360" y="1462">Applique la phase d’affûtage</text>
    <rect class="card" x="2015" y="1520" width="690" height="105" rx="22"/><text class="smallTitle" x="2360" y="1565">GoalEventFactory</text><text class="smallSub" x="2360" y="1597">Crée la séance objectif finale</text>
  </g>

  <rect class="section" x="2835" y="980" width="825" height="720" rx="32"/>
  <text class="sectionTitle" x="2880" y="1035">PERFORMANCES</text><text class="sectionHint" x="2880" y="1070">Analyse et adaptation</text>
  <g>
    <rect class="card" x="2900" y="1115" width="695" height="105" rx="22"/><text class="smallTitle" x="3247" y="1160">PerformanceValidationService</text><text class="smallSub" x="3247" y="1192">Valide les résultats saisis</text>
    <rect class="card" x="2900" y="1250" width="695" height="105" rx="22"/><text class="smallTitle" x="3247" y="1295">PerformanceAnalyzer</text><text class="smallSub" x="3247" y="1327">Analyse réussite et progression</text>
    <rect class="card" x="2900" y="1385" width="695" height="105" rx="22"/><text class="smallTitle" x="3247" y="1430">SessionAdjustmentService</text><text class="smallSub" x="3247" y="1462">Modifie uniquement les séances futures</text>
    <rect x="2980" y="1545" width="535" height="55" rx="27" class="pill"/><text class="pillText" x="3247" y="1580">BOUCLE D’ADAPTATION</text>
  </g>

  <!-- Links orchestration to domains -->
  <path class="arrow" d="M845 845V930H590V980"/><path class="arrow" d="M845 845V930H1475V980"/><path class="arrow" d="M845 845V930H2360V980"/>
  <path class="arrow" d="M1920 845V930H1475V980"/><path class="arrow" d="M1920 845V930H2360V980"/><path class="arrow" d="M1920 845V930H3247V980"/>

  <!-- Shared infrastructure -->
  <rect class="section" x="180" y="1760" width="3480" height="285" rx="32"/>
  <text class="sectionTitle" x="240" y="1815">ACCÈS AUX DONNÉES ET CONFIGURATION</text>
  <g filter="url(#shadow)">
    <rect class="card" x="360" y="1870" width="920" height="115" rx="26"/><text class="cardTitle" x="820" y="1918">AlgorithmParameterProvider</text><text class="cardSub" x="820" y="1957">Centralise les paramètres de l’algorithme</text>
    <rect class="card" x="1460" y="1870" width="920" height="115" rx="26"/><text class="cardTitle" x="1920" y="1918">Repositories Doctrine</text><text class="cardSub" x="1920" y="1957">Lecture et persistance des entités</text>
    <rect class="db" x="2560" y="1870" width="920" height="115" rx="26"/><text class="dbText" x="3020" y="1918">Base de données MySQL</text><text class="cardSub" x="3020" y="1957">Profils, plans, séances et performances</text>
  </g>
  <path class="soft" d="M820 1870V1725H1475V1700"/><path class="soft" d="M1920 1870V1730H2360V1700"/><path class="arrow" d="M2380 1927H2560"/>
  <text x="1920" y="2110" text-anchor="middle" font-size="22" fill="#b9c8e2">Les contrôleurs gèrent les requêtes ; les services portent la logique métier ; Doctrine assure la persistance transactionnelle.</text>
</svg>
