<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17399a"/>
      <stop offset="0.38" stop-color="#102769"/>
      <stop offset="0.72" stop-color="#07142e"/>
      <stop offset="1" stop-color="#030812"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="8%" r="55%">
      <stop offset="0" stop-color="#275bff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#275bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#00d9ff"/>
    </marker>
    <marker id="arrowSoft" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,5 L0,10 Z" fill="#9fb7d9"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #fff; }
      .title { font-size: 76px; font-weight: 800; letter-spacing: 1px; }
      .subtitle { font-size: 32px; fill: #b9c8e2; }
      .brand { font-size: 28px; font-weight: 800; letter-spacing: 7px; fill: #00d9ff; }
      .participant { fill: #0d1d42; stroke: #00d9ff; stroke-width: 3; }
      .participantText { font-size: 27px; font-weight: 700; text-anchor: middle; }
      .participantSmall { font-size: 23px; font-weight: 700; text-anchor: middle; }
      .lane { stroke: #6e8ab5; stroke-width: 2; stroke-dasharray: 13 13; opacity: .72; }
      .call { stroke: #00d9ff; stroke-width: 4; marker-end: url(#arrow); }
      .return { stroke: #9fb7d9; stroke-width: 3; stroke-dasharray: 12 9; marker-end: url(#arrowSoft); }
      .message { font-size: 25px; font-weight: 600; text-anchor: middle; }
      .response { font-size: 23px; fill: #c8d5e9; text-anchor: middle; }
      .note { fill: #0a1732; stroke: #5877ad; stroke-width: 2; }
      .noteText { font-size: 23px; fill: #d7e3f5; }
      .frame { fill: #07142e; fill-opacity: .65; stroke: #44689e; stroke-width: 2.5; }
      .frameLabel { fill: #00d9ff; font-size: 23px; font-weight: 800; }
      .condition { fill: #b9c8e2; font-size: 22px; font-weight: 700; }
      .success { stroke: #13ca8a; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>
  <circle cx="174" cy="134" r="62" fill="#050b18" stroke="#00d9ff" stroke-width="4" filter="url(#cyanGlow)"/>
  <text x="174" y="155" text-anchor="middle" font-size="62" font-weight="900" font-style="italic" fill="#00d9ff" transform="rotate(-6 174 134)">M</text>
  <path d="M137 176 Q174 155 211 176" fill="none" stroke="#275bff" stroke-width="9" stroke-linecap="round"/>
  <text x="270" y="121" class="brand">MON ALLURE TRAINING</text>
  <text x="270" y="205" class="title">Création du plan d’entraînement personnalisé</text>
  <text x="270" y="258" class="subtitle">IV.4 — Diagramme de séquence principal</text>
  <line x1="110" y1="315" x2="3730" y2="315" stroke="#00d9ff" stroke-opacity=".5" stroke-width="2"/>

  <!-- Participants -->
  <g filter="url(#shadow)">
    <rect class="participant" x="90" y="365" width="400" height="118" rx="26"/><text class="participantText" x="290" y="437">Utilisateur</text>
    <rect class="participant" x="625" y="365" width="400" height="118" rx="26"/><text class="participantText" x="825" y="420">Interface</text><text class="participantSmall" x="825" y="453">utilisateur</text>
    <rect class="participant" x="1160" y="365" width="400" height="118" rx="26"/><text class="participantText" x="1360" y="420">TrainingPlan</text><text class="participantSmall" x="1360" y="453">Controller</text>
    <rect class="participant" x="1695" y="365" width="400" height="118" rx="26"/><text class="participantText" x="1895" y="420">TrainingPlan</text><text class="participantSmall" x="1895" y="453">GeneratorService</text>
    <rect class="participant" x="2230" y="365" width="400" height="118" rx="26"/><text class="participantSmall" x="2430" y="420">ProfileTrainingData</text><text class="participantSmall" x="2430" y="453">Validator</text>
    <rect class="participant" x="2765" y="365" width="400" height="118" rx="26"/><text class="participantText" x="2965" y="420">Feasibility / Session</text><text class="participantSmall" x="2965" y="453">Services</text>
    <rect class="participant" x="3300" y="365" width="450" height="118" rx="26"/><text class="participantText" x="3525" y="437">Base de données</text>
  </g>

  <!-- Lifelines -->
  <line class="lane" x1="290" y1="483" x2="290" y2="2040"/><line class="lane" x1="825" y1="483" x2="825" y2="2040"/>
  <line class="lane" x1="1360" y1="483" x2="1360" y2="2040"/><line class="lane" x1="1895" y1="483" x2="1895" y2="2040"/>
  <line class="lane" x1="2430" y1="483" x2="2430" y2="2040"/><line class="lane" x1="2965" y1="483" x2="2965" y2="2040"/>
  <line class="lane" x1="3525" y1="483" x2="3525" y2="2040"/>

  <!-- Main flow -->
  <text class="message" x="558" y="565">1. Saisir l’objectif</text><line class="call" x1="290" y1="585" x2="825" y2="585"/>
  <text class="message" x="1092" y="655">2. Envoyer la demande</text><line class="call" x1="825" y1="675" x2="1360" y2="675"/>
  <text class="message" x="1627" y="745">3. generate(utilisateur, objectif)</text><line class="call" x1="1360" y1="765" x2="1895" y2="765"/>
  <text class="message" x="2710" y="835">4. Charger profil et performances</text><line class="call" x1="1895" y1="855" x2="3525" y2="855"/>
  <text class="response" x="2710" y="925">Données du coureur</text><line class="return" x1="3525" y1="945" x2="1895" y2="945"/>
  <text class="message" x="2162" y="1015">5. Vérifier le profil</text><line class="call" x1="1895" y1="1035" x2="2430" y2="1035"/>
  <text class="response" x="2162" y="1105">Résultat de validation</text><line class="return" x1="2430" y1="1125" x2="1895" y2="1125"/>

  <!-- Alternative frame -->
  <rect class="frame" x="1120" y="1175" width="2640" height="725" rx="22"/>
  <path d="M1120 1175 H1430 L1395 1226 H1120 Z" fill="#0d1d42" stroke="#44689e" stroke-width="2.5"/>
  <text class="frameLabel" x="1150" y="1210">ALT</text><text class="condition" x="1240" y="1210">[Profil valide]</text>

  <text class="message" x="2430" y="1280">6. Évaluer la faisabilité</text><line class="call" x1="1895" y1="1300" x2="2965" y2="1300"/>
  <text class="response" x="2430" y="1360">Niveau de faisabilité</text><line class="return" x1="2965" y1="1380" x2="1895" y2="1380"/>
  <text class="message" x="2430" y="1440">7. Générer semaines et séances</text><line class="call" x1="1895" y1="1460" x2="2965" y2="1460"/>
  <text class="response" x="2430" y="1520">Plan personnalisé</text><line class="return" x1="2965" y1="1540" x2="1895" y2="1540"/>
  <text class="message" x="2710" y="1600">8. Enregistrer le plan</text><line class="call" x1="1895" y1="1620" x2="3525" y2="1620"/>
  <text class="response" x="2710" y="1680">Plan enregistré</text><line class="return" x1="3525" y1="1700" x2="1895" y2="1700"/>

  <line x1="1120" y1="1745" x2="3760" y2="1745" stroke="#44689e" stroke-width="2.5"/>
  <text class="condition" x="1150" y="1784">[Profil incomplet]</text>
  <text class="response" x="1627" y="1840">Données manquantes</text><line class="return" x1="1895" y1="1860" x2="1360" y2="1860"/>

  <!-- Final success path -->
  <text class="response" x="1627" y="1965">Résultat de la demande</text><line class="return" x1="1895" y1="1985" x2="1360" y2="1985"/>
  <text class="response" x="1092" y="2030">Afficher le plan ou l’erreur</text><line class="return" x1="1360" y1="2050" x2="825" y2="2050"/>

  <rect x="90" y="2085" width="3660" height="48" rx="24" fill="#0d1d42" fill-opacity=".85" stroke="#00d9ff" stroke-opacity=".32"/>
  <text x="1920" y="2118" text-anchor="middle" font-size="22" fill="#b9c8e2">Le service générateur orchestre la validation, la faisabilité, la création des séances et la persistance du plan.</text>
</svg>
